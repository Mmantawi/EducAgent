name: Feature request
description: Propose a user-facing improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Who has this problem, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behaviour without over-prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Risks and considerations
      description: Note privacy, safety, accessibility, cost, latency, or research concerns.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
